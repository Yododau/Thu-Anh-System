<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<!-- Bỏ maximum-scale=1: iOS Safari vốn bỏ qua thuộc tính này (từ iOS 10, vì lý do
     accessibility) nên nó không giúp gì, mà lại chặn phóng to trên Android.
     Việc chặn pinch-zoom chỉ cần thiết TRONG khung crop, đã xử lý bằng
     touch-action: none trên .crop-area (css/style.css). -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Zairyu Desk</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="wrap">

  <!-- ============ THANH THƯƠNG HIỆU + CHỌN NGÔN NGỮ ============
       Nút chọn ngôn ngữ nằm RIÊNG một hàng ở góc trên bên phải, tách hẳn khỏi
       tên + câu mô tả. Nhờ vậy câu mô tả (app.tagline) dài bao nhiêu, xuống bao
       nhiêu dòng cũng không thể đẩy cụm nút ngôn ngữ rớt hàng như trước. -->
  <header class="brandbar">
    <div class="lang-row">
      <div id="lang-switch" class="lang-switch">
        <button type="button" data-lang="ja">日本語</button>
        <button type="button" data-lang="vi">Tiếng Việt</button>
        <button type="button" data-lang="en">English</button>
      </div>
    </div>

    <div class="brand">
      <span class="brand-mark">在</span>
      <span class="brand-text">
        <strong>Zairyu Desk</strong>
        <em data-i18n="app.tagline"></em>
      </span>
    </div>
  </header>

  <!-- ============ MÀN HÌNH: ĐANG TẢI ============ -->
  <section id="screen-loading" class="screen">
    <p class="muted" data-i18n="loading"></p>
  </section>

  <!-- ============ MÀN HÌNH: LINK KHÔNG HỢP LỆ ============ -->
  <section id="screen-invalid" class="screen hidden">
    <div class="card card-error">
      <h1 data-i18n="invalid.title"></h1>
      <p data-i18n="invalid.body"></p>
    </div>
  </section>

  <!-- ============ MÀN HÌNH: ĐÃ HẾT HẠN ============ -->
  <section id="screen-expired" class="screen hidden">
    <div class="card card-error">
      <h1 data-i18n="expired.title"></h1>
      <p id="expired-body"></p>
      <p data-i18n="expired.body2"></p>
    </div>
  </section>

  <!-- ============ MÀN HÌNH: NHẬN DIỆN NHÂN VIÊN (bước 0) ============
       1 link dùng chung cho cả công ty, nên phải xác nhận đúng người trước khi
       cho nộp. 3 mục: họ tên (romaji, in hoa) + ngày sinh + quốc tịch. -->
  <section id="screen-identify" class="screen hidden">

    <div class="who">
      <div><strong id="id-congty"></strong> <span class="muted" id="id-nhomg"></span></div>
      <div class="muted small">
        <span data-i18n="info.round"></span>: <span id="id-dot"></span> ·
        <span data-i18n="info.deadline"></span>: <span id="id-han"></span>
      </div>
    </div>

    <form id="identify-form" novalidate>
      <div class="card">
        <h2 data-i18n="id.title"></h2>
        <p class="muted card-sub" data-i18n="id.sub"></p>

        <div class="field" style="margin-top:14px;">
          <label data-i18n="id.name"></label>
          <input type="text" id="id-name" class="input-upper" autocomplete="off"
                 spellcheck="false" autocapitalize="characters" autocorrect="off" />
          <!-- Chú thích BẮT BUỘC nằm ngay tại dòng nhập (SPEC mục 11d): dữ liệu
               Kintone giống 100% dòng romaji in trên thẻ ngoại kiều, nên nhân
               viên chỉ cần chép lại, không gõ theo trí nhớ. -->
          <p class="field-hint" data-i18n="id.name.hint"></p>
        </div>

        <!-- Bộ chọn ngày sinh: 3 select riêng (không dùng input type="date") —
             lý do + cách hoạt động xem chú thích ở đầu js/main.js mục 0b.
             Thứ tự ngày/tháng/năm hiển thị đổi theo ngôn ngữ qua CSS (style.css). -->
        <div class="field" style="margin-top:14px;">
          <label data-i18n="id.dob"></label>
          <div class="dob-group" id="id-dob-group">
            <select class="dob-day" aria-label="Day"></select>
            <select class="dob-month" aria-label="Month"></select>
            <select class="dob-year" aria-label="Year"></select>
          </div>
        </div>

        <div class="field" style="margin-top:14px;">
          <label data-i18n="id.nat"></label>
          <select id="id-nat"></select>
        </div>
      </div>

      <div id="identify-error" class="error-box hidden"></div>

      <button type="submit" id="btn-identify" class="btn btn-primary btn-submit" data-i18n="id.continue"></button>
    </form>
  </section>

  <!-- ============ MÀN HÌNH: FORM CHÍNH ============ -->
  <section id="screen-form" class="screen hidden">

    <!-- Khối xác nhận: hiện lại đúng thông tin đã nhận diện, để nhân viên yên
         tâm là mình đang nộp cho đúng hồ sơ của mình. -->
    <div class="who who-confirmed">
      <div class="who-row">
        <span class="who-label" data-i18n="who.name"></span>
        <strong id="info-hoten"></strong>
      </div>
      <div class="who-row">
        <span class="who-label" data-i18n="who.dob"></span>
        <span id="info-ngaysinh"></span>
      </div>
      <div class="who-row">
        <span class="who-label" data-i18n="who.company"></span>
        <span><span id="info-congty"></span> <span class="muted" id="info-nhomg"></span></span>
      </div>
      <div class="muted small who-meta">
        <span data-i18n="info.round"></span>: <span id="info-dot"></span> ·
        <span data-i18n="info.deadline"></span>: <span id="info-han"></span>
      </div>
      <button type="button" id="btn-not-me" class="link-btn" data-i18n="who.notme"></button>
    </div>

    <p class="required-note muted small" data-i18n="required.note"></p>

    <form id="main-form" novalidate>

      <!-- ---- 1. Tình trạng hôn nhân ---- -->
      <div class="card">
        <h2 data-i18n="q1.title"></h2>
        <p class="muted card-sub" data-i18n="q1.sub"></p>
        <div class="radio-group" id="group-hon-nhan">
          <label><input type="radio" name="hon-nhan" value="co" /> <span data-i18n="q1.yes"></span></label>
          <label><input type="radio" name="hon-nhan" value="khong" /> <span data-i18n="q1.no"></span></label>
        </div>
      </div>

      <!-- ---- 2. Người thân đang sống tại Nhật (在日親族) ---- -->
      <div class="card">
        <h2 data-i18n="q2.title"></h2>
        <p class="muted card-sub" data-i18n="q2.sub"></p>
        <div class="radio-group" id="group-nguoi-than-nhat">
          <label><input type="radio" name="nguoi-than-nhat" value="co" /> <span data-i18n="yes"></span></label>
          <label><input type="radio" name="nguoi-than-nhat" value="khong" /> <span data-i18n="no"></span></label>
        </div>

        <div id="relatives-block" class="hidden">
          <div id="family-list"></div>
          <button type="button" id="btn-add-family" class="btn btn-secondary" data-i18n="q2.add"></button>
        </div>
      </div>

      <!-- ---- 3. Liên hệ quê nhà — luôn hiện khối này, nhân viên TỰ đánh dấu có
           thuộc diện Tokutei Gino hay không bằng checkbox; chỉ khi đánh dấu mới
           hiện 2 ô nhập số điện thoại + địa chỉ. Checkbox được TÍCH SẴN nếu dữ
           liệu Kintone (loaiTuCach) đã ghi nhận là tokutei_gino, nhưng nhân viên
           vẫn có thể tự sửa lại (xem enterMainForm() trong js/main.js). ---- -->
      <div class="card" id="card-tokutei">
        <h2 data-i18n="q3.title"></h2>
        <p class="muted card-sub" data-i18n="q3.sub"></p>

        <label class="checkbox-row" for="tokutei-check">
          <input type="checkbox" id="tokutei-check" />
          <span data-i18n="q3.check"></span>
        </label>

        <div id="tokutei-fields" class="hidden" style="margin-top:14px;">
          <div class="field">
            <label data-i18n="q3.phone"></label>
            <input type="tel" id="que-nha-sdt" />
          </div>
          <div class="field" style="margin-top:12px;">
            <label data-i18n="q3.address"></label>
            <input type="text" id="que-nha-diachi" />
          </div>
        </div>
      </div>

      <!-- ---- 4. Ảnh chân dung ---- -->
      <div class="card">
        <h2 data-i18n="q4.title"></h2>

        <ul class="checklist">
          <li data-i18n="q4.c1"></li>
          <li data-i18n="q4.c2"></li>
          <li data-i18n="q4.c3"></li>
          <li data-i18n="q4.c4"></li>
          <li data-i18n="q4.c5"></li>
        </ul>

        <div id="photo-picker">
          <label class="btn btn-primary" for="photo-input" data-i18n="q4.choose"></label>
          <!-- Không dùng capture="user": có capture thì điện thoại ép mở thẳng
               camera, không cho chọn ảnh có sẵn trong album. -->
          <input type="file" id="photo-input" accept="image/*" hidden />
        </div>

        <div id="photo-result" class="hidden">
          <img id="photo-preview" alt="" />
          <div id="photo-status" class="status"></div>
          <button type="button" id="btn-retake" class="btn btn-secondary" data-i18n="q4.retake"></button>
        </div>
      </div>

      <div id="submit-error" class="error-box hidden"></div>

      <!-- Nút nộp KHÔNG bị khoá sẵn: nhân viên bấm được bất cứ lúc nào, thiếu
           chỗ nào thì hệ thống liệt kê ra ngay bên trên. -->
      <button type="submit" id="btn-submit" class="btn btn-primary btn-submit" data-i18n="submit"></button>
    </form>
  </section>

  <!-- ============ MÀN HÌNH: THÀNH CÔNG ============ -->
  <section id="screen-success" class="screen hidden">
    <div class="card card-success">
      <h1 data-i18n="success.title"></h1>
      <p data-i18n="success.body"></p>
    </div>
  </section>

</div>

<!-- ============ MODAL CROP ============ -->
<div id="crop-modal" class="modal hidden">
  <div class="modal-inner">
    <div class="modal-head">
      <h2 data-i18n="crop.title"></h2>
      <button type="button" id="btn-crop-close" class="modal-close" aria-label="close">✕</button>
    </div>

    <div class="crop-area">
      <img id="crop-image" alt="" />
    </div>

    <p class="crop-hint" data-i18n="crop.hint"></p>
    <div id="crop-face-status" class="status"></div>

    <div class="modal-actions">
      <button type="button" id="btn-crop-cancel" class="btn btn-secondary" data-i18n="crop.cancel"></button>
      <button type="button" id="btn-crop-confirm" class="btn btn-primary" data-i18n="crop.confirm"></button>
    </div>
  </div>
</div>

<template id="family-row-template">
  <div class="family-row">
    <div class="family-row-head">
      <span class="family-row-title"></span>
      <button type="button" class="btn-remove-family" data-i18n-title="fam.remove">✕</button>
    </div>

    <div class="field">
      <label data-i18n="fam.relation"></label>
      <select class="f-relation"></select>
    </div>
    <div class="field">
      <label data-i18n="fam.name"></label>
      <input type="text" class="f-name" />
    </div>
    <div class="field">
      <label data-i18n="fam.dob"></label>
      <div class="dob-group f-dob-group">
        <select class="dob-day" aria-label="Day"></select>
        <select class="dob-month" aria-label="Month"></select>
        <select class="dob-year" aria-label="Year"></select>
      </div>
    </div>
    <div class="field">
      <label data-i18n="fam.nationality"></label>
      <select class="f-nationality"></select>
    </div>
    <div class="field">
      <label data-i18n="fam.living"></label>
      <div class="radio-group f-song-cung-group">
        <label><input type="radio" class="f-song-cung" value="co" /> <span data-i18n="yes"></span></label>
        <label><input type="radio" class="f-song-cung" value="khong" /> <span data-i18n="no"></span></label>
      </div>
    </div>
    <div class="field">
      <label data-i18n="fam.workplace"></label>
      <input type="text" class="f-workplace" />
    </div>
    <div class="field">
      <label data-i18n="fam.zairyu"></label>
      <input type="text" class="f-zairyu" />
    </div>
  </div>
</template>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
<!-- Đường dẫn cdnjs cũ của face-api.js bị 404 (không tồn tại trên cdnjs) nên
     lớp gác cổng luôn im lặng "pass" mọi ảnh. Đổi sang bản fork vladmandic/face-api
     (đã kiểm tra tải được, mô hình cũng tải được) qua jsDelivr. -->
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/i18n.js"></script>
<script src="js/config.js"></script>
<script src="js/main.js"></script>
</body>
</html>
